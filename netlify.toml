# FalcoNest – Netlify (Flutter web)
#
# Publish = výstup `flutter build web --release`.
# Povinné Environment variables (Site settings → Environment variables):
#   SUPABASE_URL
#   SUPABASE_ANON_KEY
# Volitelné:
#   APP_URL
#   FLUTTER_CHANNEL  (default: stable)
#
# Podrobný návod: docs/ops/NETLIFY_DEPLOY.md

[build]
  command = "bash scripts/netlify_build.sh"
  publish = "build/web"

[build.environment]
  NODE_VERSION = "20"

# Flutter SPA: GoRouter deep links
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
